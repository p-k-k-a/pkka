name: Build & publish backend image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Called by release.yml: a tag pushed by release-please with GITHUB_TOKEN does not
  # trigger the push event above.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.2.0
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pkka-backend:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/pkka-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
