name: Release

# On every push to main, release-please keeps a release PR up to date with the next
# version and its CHANGELOG.md entry, built from the Conventional Commit PR titles.
# Merging that PR tags the release, publishes the GitHub release, then builds the
# backend image and deploys the web app. See RELEASING.md.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  # The tag above is pushed with GITHUB_TOKEN, which does not start other workflows,
  # so the release jobs are called from here.
  backend:
    name: Backend image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  web:
    name: Web
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-web.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
