spring:
  application:
    name: pkka-backend
  profiles:
    default: dev

  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]
      - optional:classpath:.env[.properties]

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
    disable-swagger-default-url: true


# PROFILE: dev
---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pkka}
    username: ${SPRING_DATASOURCE_USERNAME:pkka}
    password: ${SPRING_DATASOURCE_PASSWORD:pkka}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    # db/dev holds dev-only seed data (sample events). Never loaded on prod.
    locations: classpath:db/migration,classpath:db/dev
    baseline-on-migrate: true
    out-of-order: true

  # OAuth2 / OIDC (Keycloak)
  security:
    oauth2:
      client:
        registration:
          keycloak-web:
            provider: keycloak
            client-id: pkka-web
            client-secret: ${KEYCLOAK_WEB_CLIENT_SECRET:change-me}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_basic

          keycloak-mobile:
            provider: keycloak
            client-id: pkka-mobile
            client-secret: ${KEYCLOAK_MOBILE_CLIENT_SECRET:change-me}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_basic

        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/pkka}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/pkka}

# App
app:
  notifications:
    base-url: ${EXPO_PUSH_BASE_URL:https://exp.host/--/api/v2/push}
    access-token: ${EXPO_PUSH_ACCESS_TOKEN:}
    reminder-cron: ${NOTIFICATIONS_REMINDER_CRON:0 0 * * * *}
    receipt-cron: ${NOTIFICATIONS_RECEIPT_CRON:0 */15 * * * *}
  mobile:
    deep-link-scheme: ${MOBILE_DEEP_LINK_SCHEME:myapp}
  web:
    success-url: ${WEB_SUCCESS_URL:http://localhost:3000/dashboard}
    logout-redirect-url: ${WEB_LOGOUT_REDIRECT_URL:http://localhost:3000/}
    cors-allowed-origins: ${WEB_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Keycloak Admin Client
keycloak:
  server-url: ${KEYCLOAK_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:pkka}
  client-id: pkka-web
  client-secret: ${KEYCLOAK_WEB_CLIENT_SECRET:change-me}
  verified-alumn-role: ${KEYCLOAK_VERIFIED_ALUMN_ROLE:verified-alumn}

# Discord
discord:
  guild-id: ${DISCORD_GUILD_ID:change-me}

# Server
server:
  port: 8080

# OpenAPI — enabled on dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Actuator — health probes; verbose on dev for local debugging
management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Logging
logging:
  level:
    root: INFO
    pl.edu.agh.backend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

# PROFILE: prod
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          keycloak-web:
            provider: keycloak
            client-id: pkka-web
            client-secret: ${KEYCLOAK_WEB_CLIENT_SECRET}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_basic

          keycloak-mobile:
            provider: keycloak
            client-id: pkka-mobile
            client-secret: ${KEYCLOAK_MOBILE_CLIENT_SECRET}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_basic

        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

app:
  notifications:
    base-url: ${EXPO_PUSH_BASE_URL:https://exp.host/--/api/v2/push}
    access-token: ${EXPO_PUSH_ACCESS_TOKEN:}
    reminder-cron: ${NOTIFICATIONS_REMINDER_CRON:0 0 * * * *}
    receipt-cron: ${NOTIFICATIONS_RECEIPT_CRON:0 */15 * * * *}
  mobile:
    deep-link-scheme: ${MOBILE_DEEP_LINK_SCHEME}
  web:
    success-url: ${WEB_SUCCESS_URL}
    logout-redirect-url: ${WEB_LOGOUT_REDIRECT_URL}
    cors-allowed-origins: ${WEB_CORS_ALLOWED_ORIGINS}

# Keycloak Admin Client
keycloak:
  server-url: ${KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM}
  client-id: pkka-web
  client-secret: ${KEYCLOAK_WEB_CLIENT_SECRET}
  verified-alumn-role: ${KEYCLOAK_VERIFIED_ALUMN_ROLE}

discord:
  guild-id: ${DISCORD_GUILD_ID}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: ${PORT}
  forward-headers-strategy: native
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true

logging:
  level:
    root: WARN
    pl.edu.agh.backend: INFO
