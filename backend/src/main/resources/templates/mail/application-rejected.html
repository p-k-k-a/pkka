<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::main})}">
<body>
<main>
    <h1 style="margin:0 0 16px;font-size:20px;color:#16212F;">
        <span th:if="${!#strings.isEmpty(firstName)}" th:text="|Cześć ${firstName}!|">Cześć Ala!</span>
        <span th:if="${#strings.isEmpty(firstName)}">Cześć!</span>
    </h1>
    <p style="margin:0 0 16px;">Twój wniosek o status alumna został odrzucony.</p>
    <th:block th:if="${!#strings.isEmpty(reason)}">
        <p style="margin:0 0 4px;font-weight:bold;">Powód:</p>
        <p style="margin:0 0 16px;">
            <th:block th:each="line, it : ${reasonLines}"><th:block th:text="${line}">Brak dyplomu.</th:block><br th:unless="${it.last}"/></th:block>
        </p>
    </th:block>
    <p style="margin:0 0 24px;">Możesz poprawić dane i złożyć wniosek ponownie.</p>
    <a th:href="${webBaseUrl + '/dashboard/verification'}"
       style="display:inline-block;padding:12px 20px;background-color:#F5A200;color:#1A1A1A;border-radius:8px;text-decoration:none;font-weight:bold;">
        Złóż wniosek ponownie
    </a>
</main>
</body>
</html>
