<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::main})}">
<body>
<main>
    <h1 style="margin:0 0 16px;font-size:20px;color:#16212F;">Wydarzenie odwołane</h1>
    <p style="margin:0 0 16px;">
        Wydarzenie <strong th:text="${title}">Warsztaty</strong>, zaplanowane na
        <span th:text="${startsAt}">1 grudnia 2026 o 18:00</span>, zostało odwołane.
        Twój zapis został anulowany i nie musisz nic robić.
    </p>
    <p style="margin:0 0 24px;">Przepraszamy za zmianę planów. Inne wydarzenia Klubu znajdziesz na naszej stronie.</p>
    <a th:href="${webBaseUrl + '/events'}"
       style="display:inline-block;padding:12px 20px;background-color:#F5A200;color:#1A1A1A;border-radius:8px;text-decoration:none;font-weight:bold;">
        Zobacz wydarzenia
    </a>
</main>
</body>
</html>
