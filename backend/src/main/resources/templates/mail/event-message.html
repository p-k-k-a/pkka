<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: layout(~{::main})}">
<body>
<main>
    <p style="margin:0 0 4px;font-size:13px;">
        Wiadomość do zapisanych na wydarzenie <strong th:text="${title}">Warsztaty</strong>
        (<span th:text="${startsAt}">1 grudnia 2026 o 18:00</span>)
    </p>
    <h1 style="margin:0 0 16px;font-size:20px;color:#16212F;" th:text="${subject}">Zmiana sali</h1>
    <div style="margin:0 0 24px;white-space:pre-line;" th:text="${message}">Treść wiadomości</div>
    <a th:href="${webBaseUrl + '/events/' + slug}"
       style="display:inline-block;padding:12px 20px;background-color:#F5A200;color:#1A1A1A;border-radius:8px;text-decoration:none;font-weight:bold;">
        Szczegóły wydarzenia
    </a>
</main>
</body>
</html>
